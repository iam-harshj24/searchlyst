# Deploy Searchlyst to GCP staging VM.
#
# Auth: Service Account JSON key stored in GCP_SA_KEY secret (gha-deployer SA).
# Build: builds searchlyst-ui and searchlyst-api Docker images, pushes to Artifact Registry.
# Deploy: SSH-over-IAP into the VM, write .env from secrets, docker compose pull/up.
# Verify: curl http://<VM_IP>/health, fail if non-200.
#
# Required secrets (set in repo Settings → Secrets and variables → Actions):
#   GCP_SA_KEY, GCP_PROJECT_ID, GCP_REGION, GCP_ZONE, GCP_VM_NAME, GCP_AR_REPO,
#   CLOUDSQL_INSTANCE_CONNECTION_NAME, DATABASE_URL, JWT_SECRET, FRONTEND_URL,
#   GEMINI_API_KEY (optional), INFATICA_API_KEY (optional), FIRECRAWL_API_KEY (optional),
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, NOTIFICATION_EMAIL (all optional),
#   VITE_GOOGLE_CLIENT_ID (optional)

name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build, push & deploy to GCP staging VM
    runs-on: ubuntu-latest
    environment: staging   # add a manual approval gate here in repo settings if you want

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set image refs
        id: images
        run: |
          REPO="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPO }}"
          echo "image_api=${REPO}/searchlyst-api:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ui=${REPO}/searchlyst-ui:${IMAGE_TAG}"   >> "$GITHUB_OUTPUT"
          echo "image_api_latest=${REPO}/searchlyst-api:staging-latest" >> "$GITHUB_OUTPUT"
          echo "image_ui_latest=${REPO}/searchlyst-ui:staging-latest"   >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.image_api }}
            ${{ steps.images.outputs.image_api_latest }}
          cache-from: type=registry,ref=${{ steps.images.outputs.image_api_latest }}
          cache-to: type=inline

      - name: Build & push UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.image_ui }}
            ${{ steps.images.outputs.image_ui_latest }}
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=registry,ref=${{ steps.images.outputs.image_ui_latest }}
          cache-to: type=inline

      - name: Render .env (locally)
        run: |
          umask 077
          cat > .env.deploy <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          NODE_ENV=production
          PORT=3000
          BIND_LOCAL_ONLY=false
          REDIS_ENABLED=false
          ALLOW_ADMIN_SETUP=false
          SEND_WELCOME_EMAIL=false
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          INFATICA_API_KEY=${{ secrets.INFATICA_API_KEY }}
          FIRECRAWL_API_KEY=${{ secrets.FIRECRAWL_API_KEY }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL=${{ secrets.NOTIFICATION_EMAIL }}
          GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          IMAGE_API=${{ steps.images.outputs.image_api }}
          IMAGE_UI=${{ steps.images.outputs.image_ui }}
          CLOUDSQL_INSTANCE_CONNECTION_NAME=${{ secrets.CLOUDSQL_INSTANCE_CONNECTION_NAME }}
          EOF

      - name: Copy deploy artifacts to VM
        run: |
          gcloud compute scp --tunnel-through-iap --zone="${{ secrets.GCP_ZONE }}" \
            docker-compose.staging.yml .env.deploy \
            "${{ secrets.GCP_VM_NAME }}":/tmp/searchlyst-deploy/

      - name: Deploy on VM
        run: |
          gcloud compute ssh --tunnel-through-iap --zone="${{ secrets.GCP_ZONE }}" \
            "${{ secrets.GCP_VM_NAME }}" --command='bash -s' <<'REMOTE'
          set -euo pipefail
          sudo mkdir -p /opt/searchlyst
          sudo cp /tmp/searchlyst-deploy/docker-compose.staging.yml /opt/searchlyst/docker-compose.yml
          sudo install -m 600 /tmp/searchlyst-deploy/.env.deploy /opt/searchlyst/.env
          sudo rm -rf /tmp/searchlyst-deploy

          cd /opt/searchlyst
          sudo docker compose pull
          sudo docker compose up -d --remove-orphans
          sudo docker image prune -f >/dev/null 2>&1 || true

          # Wait up to 90s for the api container to be healthy
          for i in $(seq 1 18); do
            STATUS=$(sudo docker inspect -f '{{.State.Health.Status}}' searchlyst-api 2>/dev/null || echo "starting")
            echo "[health] attempt $i: $STATUS"
            if [ "$STATUS" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "API container did not become healthy in time"
          sudo docker compose logs --tail=200 searchlyst-api
          exit 1
          REMOTE

      - name: Smoke-test public endpoint
        run: |
          IP=$(gcloud compute addresses describe searchlyst-staging-ip \
            --region="${{ secrets.GCP_REGION }}" --format='value(address)')
          echo "Smoke testing http://${IP}/health"
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://${IP}/health" || true)
            echo "  attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Staging is live at http://${IP}/"
              exit 0
            fi
            sleep 6
          done
          echo "Public smoke test failed"
          exit 1

      - name: Cleanup local secrets
        if: always()
        run: rm -f .env.deploy
