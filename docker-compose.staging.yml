services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.13.0
    container_name: cloud-sql-proxy
    restart: unless-stopped
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "--auto-iam-authn=false"
      - "${CLOUDSQL_INSTANCE_CONNECTION_NAME}"
    healthcheck:
      test: ["CMD", "/cloud-sql-proxy", "--help"]
      interval: 30s
      timeout: 5s
      retries: 3

  searchlyst-api:
    image: ${IMAGE_API}
    container_name: searchlyst-api
    restart: unless-stopped
    depends_on:
      cloud-sql-proxy:
        condition: service_started
    env_file:
      - .env
    environment:
      PORT: "3000"
      NODE_ENV: production
      BIND_LOCAL_ONLY: "false"
      REDIS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  searchlyst-ui:
    image: ${IMAGE_UI}
    container_name: searchlyst-ui
    restart: unless-stopped
    depends_on:
      searchlyst-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
