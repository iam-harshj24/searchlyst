# Render.com Blueprint - Deploy Searchlyst Backend (Prisma + SQLite)
# https://render.com/docs/blueprint-spec
#
# SQLite file lives under backend/. On free web services the filesystem is ephemeral; data can
# reset on redeploy. For durable storage, add a Render Disk and set DATABASE_URL to
# file:/path/on/disk/prod.db (see https://render.com/docs/disks).
services:
  - type: web
    name: searchlyst-api
    runtime: node
    rootDir: backend

    buildCommand: npm install && npx prisma generate
    startCommand: mkdir -p prisma/data && npx prisma migrate deploy && npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prisma/data/prod.db
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: INFATICA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      # Must match the browser Origin of your deployed frontend (e.g. https://youruser.github.io).
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SEND_WELCOME_EMAIL
        value: "false"
      - key: ALLOW_ADMIN_SETUP
        value: "false"
