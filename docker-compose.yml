# Local Postgres for Searchlyst — run: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: searchlyst
      POSTGRES_PASSWORD: searchlyst
      POSTGRES_DB: searchlyst
    ports:
      - "5432:5432"
    volumes:
      - searchlyst_pgdata:/var/lib/postgresql/data

volumes:
  searchlyst_pgdata:
